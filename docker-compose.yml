# Local development stack:  cp .env.example .env  &&  docker compose up -d --build
#   db          PostgreSQL 15 + pgvector       localhost:5432
#   api         public REST API (hot reload)   http://localhost:8000/docs
#   ai_service  internal AI service            http://localhost:8001/docs
# Owner: Mogith

services:
  db:
    image: pgvector/pgvector:pg15
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      # Inside docker the database and the AI service are reached by service name.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AI_SERVICE_URL: http://ai_service:8001
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Mount the code so changes reload instantly (dev only).
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai_service:
    build:
      context: .
      dockerfile: ai_service/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn ai_service.main:app --host 0.0.0.0 --port 8001 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8001/health', headers={'X-Service-Token': os.environ['AI_SERVICE_TOKEN']}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
