# Alembic configuration. The database URL is NOT stored here: migrations/env.py reads
# DATABASE_URL from the environment / .env (shared/settings.py).
#
#   alembic upgrade head                              # apply all migrations
#   alembic revision --autogenerate -m "add x table"  # after changing shared/db/models
#   alembic downgrade -1                              # undo the last migration

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Files are named like 0002_add_x_table.py
file_template = %%(rev)s_%%(slug)s
path_separator = os
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
