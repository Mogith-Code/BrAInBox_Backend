# Backend CI: lint, type check, migrations, tests and Docker builds. Owner: Mogith
name: backend-ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: brainbox
          POSTGRES_PASSWORD: brainbox
          POSTGRES_DB: brainbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brainbox -d brainbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://brainbox:brainbox@localhost:5432/brainbox_test
      TEST_DATABASE_URL: postgresql+asyncpg://brainbox:brainbox@localhost:5432/brainbox_test
      USE_FAKE_AI: "true"
      AI_SERVICE_TOKEN: ci-service-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,ai,dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy (non-blocking for now)
        continue-on-error: true
        run: mypy api ai_service shared

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Alembic check (models match migrations)
        run: alembic check

      - name: Pytest
        run: pytest -rs

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f api/Dockerfile -t brainbox-api:ci .
      - name: Build ai_service image
        run: docker build -f ai_service/Dockerfile -t brainbox-ai:ci .
